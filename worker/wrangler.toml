name = "etch-strava-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put STRAVA_CLIENT_ID
#   wrangler secret put STRAVA_CLIENT_SECRET
#
# After `wrangler deploy`, the Worker is reachable at:
#   https://etch-strava-proxy.<your-subdomain>.workers.dev
# Paste that URL into Etch/Config/StravaConfig.swift (tokenProxyURL).
