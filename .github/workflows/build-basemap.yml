# Builds Etch's own basemap and puts it in R2 — the step that turns the map editions from
# "beautiful, display-only" into sellable prints.
#
# The whole pipeline around this already exists: EtchCartography styles the map, MapLibre
# renders it, the fulfilment worker serves tiles out of R2 (fulfilment/src/tiles.ts), and the
# print path refuses to fall back to Apple. The one missing object is `basemap.pmtiles` in the
# bucket. This workflow makes it from the public Protomaps daily planet build — an OpenStreetMap
# extract, ODbL, printable with attribution — without needing a machine bigger than a runner.
#
# `pmtiles extract` reads byte ranges over HTTP, so a regional archive is produced without ever
# downloading the 120 GB planet. Region and zoom come from .github/basemap-request.txt; edit it
# and commit to run. Start with your own market (a state fits a runner's disk easily), verify a
# print end to end, then widen. A full-US z15 archive needs more disk than a hosted runner has —
# when that day comes, run this on a larger runner or extract in regional pieces.
#
# Upload goes through the fulfilment worker's own multipart endpoints, authenticated with the
# ETCH_UPLOAD_TOKEN the repo already holds — no storage credentials to create anywhere.
#
# After a green run: set "basemapReady": true in fulfilment/config/app.json (bump its version)
# and commit — the deploy-config workflow serves it, and every install flips to Etch cartography
# on its next config refresh. No app release. Flip it back the same way if tiles misbehave.

name: Build basemap

on:
  push:
    branches: [claude/rebrand-etch]
    paths:
      - ".github/basemap-request.txt"
      - ".github/workflows/build-basemap.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A continental-US extract is ~1.5 GB at z12 metadata plus the bulk at z14–15 — the extract
    # and its split parts both live on disk at once, so the work happens on /mnt (the runner's
    # large scratch volume) and the original is deleted the moment it is split.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Read the request
        id: request
        run: |
          set -e
          FILE=.github/basemap-request.txt
          BBOX=$(grep -E '^bbox=' "$FILE" | tail -1 | cut -d= -f2- | xargs)
          MAXZOOM=$(grep -E '^maxzoom=' "$FILE" | tail -1 | cut -d= -f2- | xargs)
          KEY=$(grep -E '^key=' "$FILE" | tail -1 | cut -d= -f2- | xargs)
          [ -z "$BBOX" ] && { echo "::error::bbox= missing from $FILE"; exit 1; }
          [ -z "$MAXZOOM" ] && MAXZOOM=15
          [ -z "$KEY" ] && KEY=basemap.pmtiles
          echo "bbox=$BBOX" >> "$GITHUB_OUTPUT"
          echo "maxzoom=$MAXZOOM" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "extracting bbox=$BBOX maxzoom=$MAXZOOM → r2:$KEY"

      - name: Install pmtiles CLI
        run: |
          set -e
          curl -sSL -o pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.22.1/go-pmtiles_1.22.1_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          ./pmtiles version

      - name: Extract the region from the latest Protomaps build
        run: |
          set -e
          sudo mkdir -p /mnt/basemap && sudo chown "$USER" /mnt/basemap
          df -h / /mnt
          # The newest daily build, found by probing dates rather than trusting an index —
          # builds are named YYYYMMDD.pmtiles, and a one-byte range read proves one exists.
          BUILD=""
          for D in $(seq 1 10); do
            CAND=$(date -u -d "-$D days" +%Y%m%d).pmtiles
            if curl -sf -r 0-0 -o /dev/null "https://build.protomaps.com/$CAND"; then
              BUILD=$CAND; break
            fi
          done
          [ -n "$BUILD" ] || { echo "::error::no Protomaps build found in the last 10 days"; exit 1; }
          echo "planet build: $BUILD"
          ./pmtiles extract "https://build.protomaps.com/$BUILD" /mnt/basemap/basemap.pmtiles \
            --bbox="${{ steps.request.outputs.bbox }}" \
            --maxzoom="${{ steps.request.outputs.maxzoom }}"
          ls -lh /mnt/basemap/basemap.pmtiles
          ./pmtiles show /mnt/basemap/basemap.pmtiles

      - name: Upload through the fulfilment worker
        env:
          TOKEN: ${{ secrets.ETCH_UPLOAD_TOKEN }}
        run: |
          set -e
          [ -n "$TOKEN" ] || { echo "::error::ETCH_UPLOAD_TOKEN secret is missing"; exit 1; }
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          KEY="${{ steps.request.outputs.key }}"
          AUTH="Authorization: Bearer $TOKEN"

          # 64 MB parts: inside the Worker request cap and its memory. The original is deleted
          # the moment it is split — a nationwide archive and its parts don't both fit twice.
          cd /mnt/basemap
          split -b 64m basemap.pmtiles part_
          rm -f basemap.pmtiles
          COUNT=$(ls part_* | wc -l | xargs)
          echo "uploading $COUNT parts to $KEY"

          UPLOAD_ID=$(curl -sSf -X POST -H "$AUTH" "$BASE/admin/basemap/create?key=$KEY" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['uploadId'])")

          PARTS="["
          N=1
          for F in part_*; do
            # A nationwide upload is hundreds of sequential PUTs, and the edge will 503 a few
            # of them — the first US run died at part 92 of ~350 after three retries spanning
            # 34 seconds. Eight attempts with a growing pause ride out a multi-minute blip.
            for ATTEMPT in 1 2 3 4 5 6 7 8; do
              ETAG=$(curl -sSf -X PUT -H "$AUTH" --data-binary @"$F" \
                "$BASE/admin/basemap/part?key=$KEY&uploadId=$UPLOAD_ID&part=$N" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['etag'])") && break
              echo "part $N attempt $ATTEMPT failed; retrying"; sleep $((ATTEMPT * 20))
              [ "$ATTEMPT" = 8 ] && { echo "::error::part $N failed after 8 attempts"; exit 1; }
            done
            [ "$N" -gt 1 ] && PARTS="$PARTS,"
            PARTS="$PARTS{\"partNumber\":$N,\"etag\":\"$ETAG\"}"
            echo "  part $N/$COUNT ok"
            N=$((N + 1))
          done
          PARTS="$PARTS]"

          curl -sSf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"parts\":$PARTS}" \
            "$BASE/admin/basemap/complete?key=$KEY&uploadId=$UPLOAD_ID"
          echo
          echo "uploaded $KEY"

      - name: Verify the worker serves it
        run: |
          set -e
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          curl -sSf "$BASE/tiles/tiles.json" | head -c 400
          echo
          # A real tile from the middle of the requested region, through the worker's range
          # reads — tiles.json alone proves the header, not the archive.
          TILE=$(python3 -c "import math; b='${{ steps.request.outputs.bbox }}'.split(','); lon=(float(b[0])+float(b[2]))/2; lat=(float(b[1])+float(b[3]))/2; z=10; n=2**z; x=int((lon+180)/360*n); y=int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*n); print(f'{z}/{x}/{y}')")
          CODE=$(curl -s -o tile.mvt -w "%{http_code}" "$BASE/tiles/$TILE.mvt")
          SIZE=$(wc -c < tile.mvt | xargs)
          echo "tile $TILE → HTTP $CODE, $SIZE bytes"
          [ "$CODE" = "200" ] && [ "$SIZE" -gt 100 ] || { echo "::error::tile fetch failed"; exit 1; }
          echo "basemap serving — set basemapReady:true in fulfilment/config/app.json to go live"
