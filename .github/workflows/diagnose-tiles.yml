# Fetches real tiles from the fulfilment worker and decodes them the way MapLibre would.
#
# Exists because "unknown pbf field type exception" killed every basemap snapshot on device
# and in the preview rig, and nothing in the serving path ever *decoded* a tile: the archive
# build's verify step checked HTTP 200 and a byte count, which garbage passes. This walks the
# protobuf wire format byte by byte — the same walk protozero does inside MapLibre — so a tile
# that would throw there fails here, with the offending byte offset and the layer names of
# tiles that do parse.
#
# The session's egress proxy can't reach workers.dev, so the probe runs here.

name: Diagnose tiles

on:
  workflow_dispatch:
  push:
    branches: [claude/rebrand-etch]
    paths:
      - ".github/workflows/diagnose-tiles.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and decode tiles
        run: |
          set -e
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev

          echo "── tiles.json"
          curl -sS "$BASE/tiles/tiles.json"
          echo; echo

          cat > decode.py <<'PY'
          import sys, gzip

          def walk(data, depth=0, max_depth=3):
              """protozero's walk: yields (field, wiretype) or raises like MapLibre would."""
              i, n = 0, len(data)
              fields = []
              while i < n:
                  start = i
                  # varint key
                  key, shift = 0, 0
                  while True:
                      if i >= n: raise ValueError(f"truncated varint key at {start}")
                      b = data[i]; i += 1
                      key |= (b & 0x7F) << shift; shift += 7
                      if not (b & 0x80): break
                  field, wt = key >> 3, key & 7
                  if wt == 0:      # varint
                      while i < n and data[i] & 0x80: i += 1
                      i += 1
                  elif wt == 1: i += 8
                  elif wt == 5: i += 4
                  elif wt == 2:    # length-delimited
                      ln, shift = 0, 0
                      while True:
                          if i >= n: raise ValueError(f"truncated length at {start}")
                          b = data[i]; i += 1
                          ln |= (b & 0x7F) << shift; shift += 7
                          if not (b & 0x80): break
                      if i + ln > n: raise ValueError(f"field {field} overruns buffer at {start} (len {ln}, have {n-i})")
                      fields.append((field, data[i:i+ln]))
                      i += ln
                      continue
                  else:
                      raise ValueError(f"unknown pbf field type {wt} at byte {start} (field {field})")
                  fields.append((field, None))
              return fields

          raw = open(sys.argv[1], 'rb').read()
          label = sys.argv[2]
          print(f"{label}: {len(raw)} bytes, magic {raw[:2].hex() if raw else '(empty)'}")
          if not raw:
              sys.exit(0)
          if raw[:2] == b'\x1f\x8b':
              try:
                  raw = gzip.decompress(raw)
                  print(f"  gunzipped to {len(raw)} bytes")
              except Exception as e:
                  print(f"  GUNZIP FAILED: {e}"); sys.exit(1)
          try:
              layers = [v for f, v in walk(raw) if f == 3 and v is not None]
              names = []
              for lay in layers:
                  for f, v in walk(lay):
                      if f == 1 and v is not None:
                          names.append(v.decode('utf-8', 'replace'))
                          break
              print(f"  DECODES OK — {len(layers)} layers: {', '.join(names)}")
          except ValueError as e:
              print(f"  DECODE FAILED — {e}")
              print(f"  first 32 bytes: {raw[:32].hex()}")
              sys.exit(1)
          PY

          # Gilbert, AZ — where the preview harness composes its marathon — at the zooms the
          # style actually pulls: overview through building-level.
          FAIL=0
          for Z in 8 10 12 14 15; do
            read X Y <<< $(python3 -c "
          import math
          lon, lat, z = -111.789, 33.352, $Z
          n = 2**z
          x = int((lon+180)/360*n)
          y = int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*n)
          print(x, y)")
            URL="$BASE/tiles/$Z/$X/$Y.mvt"
            echo "── $URL"
            # Exactly as URLSession asks: gzip accepted, and curl inflates on Content-Encoding.
            HDRS=$(curl -sS -D - -o tile.bin --compressed -H "Accept-Encoding: gzip" "$URL" | tr -d '\r')
            echo "$HDRS" | grep -iE "^(HTTP|content-encoding|content-length|content-type|cf-)" || true
            python3 decode.py tile.bin "z$Z (as URLSession sees it)" || FAIL=1
            # And the raw bytes, no decoding, to see what is actually stored/served.
            curl -sS -o raw.bin -H "Accept-Encoding: identity" "$URL"
            python3 decode.py raw.bin "z$Z (raw, identity)" || FAIL=1
            echo
          done

      - name: Terrain and imagery routes serve real pixels
        run: |
          set -e
          # The Terrain preview was shot over Gilbert AZ, which is flat — a hillshade of
          # nothing looks identical to no hillshade at all. So prove the routes at the byte
          # level: /terrain must return a PNG (Terrarium elevation), /imagery a JPEG (USGS
          # photography), both through the worker's proxy and cache.
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          check() {
            local url="$1" magic="$2" what="$3"
            local code head size
            code=$(curl -s -o t.bin -w "%{http_code}" "$url")
            size=$(wc -c < t.bin | xargs)
            head=$(head -c 4 t.bin | xxd -p)
            echo "── $what → HTTP $code, $size bytes, head $head"
            [ "$code" = "200" ] || { echo "::error::$what did not return 200"; exit 1; }
            case "$head" in
              "$magic"*) : ;;
              *) echo "::error::$what is not the expected format"; exit 1 ;;
            esac
          }
          # Gilbert (flat) and Mount Baldy above San Gabriel (relief worth shading).
          check "$BASE/terrain/12/776/1645.png"  "89504e47" "terrain, Gilbert AZ"
          check "$BASE/terrain/12/699/1633.png"  "89504e47" "terrain, San Gabriel mountains"
          check "$BASE/imagery/14/2793/6528"     "ffd8"     "imagery, San Diego"

      - name: Wallet pass signs and verifies
        run: |
          set -e
          # The five PASS_* secrets are in and the worker redeployed — prove /giftpass end to
          # end: a 200 with a real zip, the six files a pkpass needs, a PKCS#7 signature that
          # verifies over the manifest, and Apple's chain (WWDR + the Pass Type ID cert) inside.
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          CODE=$(curl -s -X POST "$BASE/giftpass" \
            -H "Content-Type: application/json" \
            -d '{"code":"PROBETESTCODE123","amount":"$50"}' \
            -o gift.pkpass -w "%{http_code}")
          echo "── /giftpass → HTTP $CODE, $(wc -c < gift.pkpass | xargs) bytes"
          if [ "$CODE" = "503" ]; then
            echo "::error::pass signing not configured on the worker — secrets missing"
            cat gift.pkpass; exit 1
          fi
          [ "$CODE" = "200" ] || { echo "::error::unexpected status"; cat gift.pkpass; exit 1; }
          unzip -o gift.pkpass -d pass >/dev/null
          ls pass
          for f in pass.json icon.png icon@2x.png icon@3x.png logo.png manifest.json signature; do
            [ -f "pass/$f" ] || { echo "::error::pkpass is missing $f"; exit 1; }
          done
          python3 - <<'PY'
          import json, hashlib
          manifest = json.load(open("pass/manifest.json"))
          for name, digest in manifest.items():
              actual = hashlib.sha1(open(f"pass/{name}", "rb").read()).hexdigest()
              assert actual == digest, f"{name}: manifest {digest} != actual {actual}"
          p = json.load(open("pass/pass.json"))
          assert p["storeCard"]["backFields"][0]["value"] == "PROBETESTCODE123"
          assert p["barcodes"][0]["message"] == "PROBETESTCODE123"
          print("manifest digests match; pass.json carries the code; type", p["passTypeIdentifier"])
          PY
          openssl smime -verify -inform DER -in pass/signature \
            -content pass/manifest.json -noverify >/dev/null
          echo "── signature verifies over the manifest"
          openssl pkcs7 -inform DER -in pass/signature -print_certs -noout | grep -i "subject" | head -4

      - name: Which User-Agents does the edge admit?
        run: |
          set -e
          # The sweep's 857 requests ALL came back 403 while curl, minutes earlier from the
          # same runner, was served. The worker has no auth on /tiles — so Cloudflare's edge
          # is deciding by request identity, and the prime suspect is the User-Agent: the
          # sweep announced Python-urllib, the app announces "Etch/1.0 MapLibre/…", neither
          # looks like a browser. A 403 HTML page's first byte read as a protobuf key is wire
          # type 4 — the same "unknown pbf field type exception" the snapshotter logs. One
          # request per UA, body printed so Cloudflare's own error code names the feature.
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          URL="$BASE/tiles/12/776/1645.mvt"
          probe() {
            local label="$1"; shift
            local code
            code=$(curl -s -o body.bin -w "%{http_code}" "$@" "$URL")
            local size head
            size=$(wc -c < body.bin | xargs)
            head=$(head -c 2 body.bin | xxd -p)
            echo "── $label → HTTP $code, $size bytes, head $head"
            if [ "$code" != "200" ]; then
              echo "   body: $(head -c 300 body.bin | tr '\n' ' ')"
            fi
            sleep 2
          }
          probe "curl default UA"
          probe "no UA at all" -H "User-Agent:"
          probe "Python-urllib" -A "Python-urllib/3.12"
          probe "the app (Etch/MapLibre)" -A "Etch/1.0 MapLibre/6.29.0 Darwin/23.0.0"
          probe "Mobile Safari" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1"

      - name: Sweep for corrupt regions
        run: |
          set -e
          # A single point decoding proves nothing about the archive: it went to R2 as 280
          # multipart pieces through a retry loop, and one bad piece corrupts a contiguous
          # Hilbert range — a geographic stripe. A snapshot dies if ANY tile in its viewport is
          # bad. So: every tile a snapshot would pull for the two routes that visibly failed
          # (Gilbert AZ in CI, San Diego on device), plus a nationwide z10 lattice.
          BASE=https://etch-fulfilment.clintpuhrmann.workers.dev
          python3 - "$BASE" <<'PY'
          import sys, math, gzip, urllib.request, concurrent.futures

          BASE = sys.argv[1]

          def wire_ok(data):
              i, n = 0, len(data)
              while i < n:
                  key, shift = 0, 0
                  while True:
                      if i >= n: return "truncated key"
                      b = data[i]; i += 1
                      key |= (b & 0x7F) << shift; shift += 7
                      if not (b & 0x80): break
                  wt = key & 7
                  if wt == 0:
                      while i < n and data[i] & 0x80: i += 1
                      i += 1
                  elif wt == 1: i += 8
                  elif wt == 5: i += 4
                  elif wt == 2:
                      ln, shift = 0, 0
                      while True:
                          if i >= n: return "truncated len"
                          b = data[i]; i += 1
                          ln |= (b & 0x7F) << shift; shift += 7
                          if not (b & 0x80): break
                      if i + ln > n: return f"overrun at {i}"
                      i += ln
                  else:
                      return f"wire type {wt} at {i}"
              return None

          def tile_xy(lon, lat, z):
              n = 2**z
              x = int((lon+180)/360*n)
              y = int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*n)
              return x, y

          jobs = []
              # Viewport sweeps: a margin of tiles around each route at the zooms a poster uses.
          for label, lon0, lat0, lon1, lat1 in [
              ("gilbert",  -111.85, 33.30, -111.72, 33.42),
              ("sandiego", -117.28, 32.68, -117.05, 32.85),
          ]:
              for z in (11, 12, 13, 14):
                  x0, y1 = tile_xy(lon0, lat0, z)
                  x1, y0 = tile_xy(lon1, lat1, z)
                  for x in range(x0, x1+1):
                      for y in range(y0, y1+1):
                          jobs.append((label, z, x, y))
          # Nationwide lattice: continental US at z10, every ~1.5 degrees.
          lon = -124.0
          while lon < -67.0:
              lat = 25.5
              while lat < 49.0:
                  x, y = tile_xy(lon, lat, 10)
                  jobs.append(("lattice", 10, x, y))
                  lat += 1.5
              lon += 1.5

          jobs = list(dict.fromkeys(jobs))
          print(f"{len(jobs)} tiles to check")

          def check(job):
              label, z, x, y = job
              url = f"{BASE}/tiles/{z}/{x}/{y}.mvt"
              try:
                  # A browser UA, or the edge 403s the whole sweep and answers a different
                  # question than the archive-integrity one this step asks.
                  req = urllib.request.Request(url, headers={
                      "Accept-Encoding": "identity",
                      "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) "
                                    "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 "
                                    "Mobile/15E148 Safari/604.1",
                  })
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      code = r.status
              except Exception as e:
                  return (job, f"fetch failed: {e}")
              if code == 204 or not body:
                  return (job, None if label == "lattice" else "empty inside coverage")
              if body[:2] == b"\x1f\x8b":
                  try: body = gzip.decompress(body)
                  except Exception as e: return (job, f"gunzip failed: {e}")
              problem = wire_ok(body)
              return (job, problem)

          bad = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for job, problem in pool.map(check, jobs):
                  if problem:
                      bad += 1
                      label, z, x, y = job
                      print(f"BAD {label} z{z}/{x}/{y}: {problem}")
          print(f"{bad} bad of {len(jobs)}")
          sys.exit(1 if bad else 0)
          PY
