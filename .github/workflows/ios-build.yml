name: iOS Build

# Compile-checks Etch on a real macOS runner (simulator, no code signing).
# This is our build verification since the app is authored without a local Xcode.
on:
  push:
    branches: [ "claude/rebrand-etch" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -e
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          echo "SDKs:"; xcodebuild -showsdks | grep -i ios || true

      - name: Build (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Etch.xcodeproj \
            -scheme Etch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO

      # Xcode Cloud archives with Release configuration for the device SDK — a stricter
      # compile than the Debug/simulator check above (whole-module optimization, device-only
      # availability). b566 and b567 sailed through this job and then failed the Xcode Cloud
      # archive, which is invisible from here; this job reproduces that class of failure
      # where the log can actually be read.
      - name: Build (Release, device SDK, no signing — archive parity)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Etch.xcodeproj \
            -scheme Etch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-release \
            CODE_SIGNING_ALLOWED=NO

      # Adding an event's course is meant to be a file drop into Etch/Resources/Courses, relying
      # on the target being a synchronized folder. If that ever stops bundling the files, the
      # process silently does nothing and every course quietly disappears — so prove it here.
      - name: Course files reach the app bundle
        run: |
          set -e
          python3 scripts/event-library.py --check
          APP=$(find dd/Build/Products -name "Etch.app" -maxdepth 3 | head -1)
          echo "bundle: $APP"
          find "$APP" -name "*.gpx" -o -name "*.tcx" -o -name "*.fit" | sed "s|$APP/||"
          COUNT=$(find "$APP" \( -name "*.gpx" -o -name "*.tcx" -o -name "*.fit" \) | wc -l | tr -d ' ')
          ON_DISK=$(ls Etch/Resources/Courses 2>/dev/null | wc -l | tr -d ' ')
          echo "$COUNT of $ON_DISK course file(s) reached the bundle"
          if [ "$COUNT" -lt "$ON_DISK" ]; then
            echo "::error::Course files did not reach the app bundle — the drop-in path is broken."
            exit 1
          fi

      # Behavioural checks, actually executed. The simulator build above is already on disk, so
      # this costs a boot and a launch rather than another compile.
      #
      # `ETCH_PREVIEW=scope-rule` opens ScopeRuleCheckView directly, which drives the production
      # ActivitySettings scope rule and the production Reveal lifecycle and writes a verdict to the
      # app container. The preview *screenshot* workflow can only run on the default branch, which
      # is why this lives here instead: this workflow runs on `pull_request`, so the check runs
      # before a merge rather than after one.
      #
      # The assertions below are deliberately paranoid about a green-but-empty run: an app that
      # crashes on launch, a preview route that silently falls through to the normal UI, or a
      # check block that stopped running all produce a missing or short report, and each of those
      # has to be a red job. Printing "RESULT: FAIL" and exiting 0 is the failure mode this step
      # exists to prevent.
      - name: Scope rule & reveal lifecycle (simulator)
        id: scope_rule
        run: |
          set -o pipefail
          set -e
          mkdir -p check-reports

          # `|| true` so an empty match reaches the explicit error below rather than dying under
          # `set -e` with nothing but a non-zero exit code.
          UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone (1[5-9]|[2-9][0-9])" | grep -v "Plus\|Max\|SE" \
            | head -1 | grep -oE "[0-9A-F-]{36}" || true)
          if [ -z "$UDID" ]; then
            echo "::error::No suitable iPhone simulator on this runner."
            exit 1
          fi
          echo "Using device $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find dd/Build/Products -name "Etch.app" -maxdepth 3 | head -1 || true)
          if [ -z "$APP" ]; then
            echo "::error::No Etch.app from the simulator build — cannot run the check."
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults write com.nwagtech.etch didCompleteOnboarding -bool true
          xcrun simctl spawn "$UDID" defaults write com.nwagtech.etch didCompleteSetup -bool true

          # Two checks, two launches.
          #
          # scope-rule is pure value logic — the shared scope rule and the reveal state machine.
          # reveal-diagnostic drives the wiring those decisions sit in, in the real HomeView: a
          # search result selected from the States overlay while a Favorites filter that excludes
          # it is active, which is the path that regressed twice and the one a value-level check
          # cannot reach. It needs the seeded library and the map's own update cycle, so it is
          # slower and gets a longer budget.
          run_check () {
            NAME="$1"; PREVIEW="$2"; DIAG="$3"; TRIES="$4"
            echo "── running $NAME"
            xcrun simctl terminate "$UDID" com.nwagtech.etch 2>/dev/null || true
            SIMCTL_CHILD_ETCH_PREVIEW="$PREVIEW" \
            SIMCTL_CHILD_ETCH_DIAG_REVEAL="$DIAG" \
              xcrun simctl launch "$UDID" com.nwagtech.etch >/dev/null

            # Poll rather than sleep blind: a cold launch on a shared runner is not predictable.
            REPORT=""
            for _ in $(seq 1 "$TRIES"); do
              CONTAINER=$(xcrun simctl get_app_container "$UDID" com.nwagtech.etch data 2>/dev/null || true)
              if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/$NAME-report.txt" ]; then
                REPORT="$CONTAINER/Documents/$NAME-report.txt"
                break
              fi
              sleep 2
            done

            if [ -z "$REPORT" ]; then
              echo "::error::$NAME wrote no report — the check did not run (crash, or the preview route did not open)."
              xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "Etch"' \
                --style compact 2>/dev/null | tail -80 || true
              return 1
            fi

            cp "$REPORT" "check-reports/$NAME-report.txt"
            rm -f "$REPORT"
            echo "── REPORT $NAME"
            cat "check-reports/$NAME-report.txt"
            echo ""
            echo "── END-REPORT"
          }

          FAILED=0
          run_check scope-rule       scope-rule 0 60  || FAILED=1
          run_check photo-memory     photo-memory 0 60 || FAILED=1
          run_check reveal-diagnostic home       1 120 || FAILED=1

          python3 - <<'PY' || FAILED=1
          import glob, sys

          problems = []
          reports = sorted(glob.glob("check-reports/*-report.txt"))
          if len(reports) != 3:
              problems.append("expected 3 reports, found %d: %s" % (len(reports), reports))

          def number(lines, label):
              for line in lines:
                  if line.startswith(label + ":"):
                      return int(line.split(":", 1)[1].strip())
              return None

          for path in reports:
              name = path.split("/")[-1].replace("-report.txt", "")
              lines = [l.strip() for l in open(path, encoding="utf-8").read().splitlines() if l.strip()]

              before = len(problems)

              def fault(msg):
                  problems.append("%s: %s" % (name, msg))

              expected = number(lines, "EXPECTED_CHECKS")
              ran = number(lines, "RAN_CHECKS")
              passes = [l for l in lines if l.startswith("PASS")]
              failures = [l for l in lines if l.startswith("FAIL")]
              verdict = [l for l in lines if l.startswith("RESULT:")]

              if expected is None or ran is None:
                  fault("report is missing EXPECTED_CHECKS/RAN_CHECKS — it is not a complete report")
              else:
                  if ran != expected:
                      fault("incomplete: ran %d of %d checks" % (ran, expected))
                  if ran <= 0:
                      fault("no checks ran at all")
                  if len(passes) + len(failures) != ran:
                      fault("report lists %d result lines but claims %d checks"
                            % (len(passes) + len(failures), ran))

              if failures:
                  fault("%d failing check(s):\n  %s" % (len(failures), "\n  ".join(failures)))

              if len(verdict) != 1:
                  fault("expected exactly one RESULT: line, found %d" % len(verdict))
              elif verdict[0] != "RESULT: ALL PASS":
                  fault("verdict is %r" % verdict[0])

              if len(problems) == before:
                  print("%s: %d/%d checks passed" % (name, ran, expected))

          if problems:
              for p in problems:
                  print("::error::%s" % p)
              sys.exit(1)
          PY

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Behavioural checks failed — reports above and in the check-reports artifact."
            exit 1
          fi

      # Preserve the verdict even when the step above fails — a red run is exactly when the
      # report is worth reading.
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: check-reports/
          if-no-files-found: warn

      # If the app died before it could write anything, the .ips report says why.
      - name: Crash reports
        if: failure()
        run: |
          REPORTS=$(find "$HOME/Library/Logs/DiagnosticReports" -name '*Etch*' -mmin -40 2>/dev/null | head -5)
          if [ -z "$REPORTS" ]; then
            echo "No Etch crash reports."
          else
            for FILE in $REPORTS; do
              echo "── CRASH REPORT $(basename "$FILE")"
              head -c 24000 "$FILE"
              echo ""
              echo "── END CRASH REPORT"
            done
          fi

      # Xcode Cloud disables automatic SPM resolution and refuses to build unless
      # Package.resolved is committed. This runner just resolved for real, so print
      # the exact file between markers for the working session to commit verbatim.
      - name: Print Package.resolved for Xcode Cloud
        if: always()
        run: |
          RESOLVED="Etch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f "$RESOLVED" ]; then
            echo "── BEGIN-PACKAGE-RESOLVED"
            cat "$RESOLVED"
            echo "── END-PACKAGE-RESOLVED"
          else
            echo "No Package.resolved generated at $RESOLVED"
            find Etch.xcodeproj -name "Package.resolved" -print 2>/dev/null || true
          fi
