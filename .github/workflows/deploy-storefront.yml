# Deploys the Etch storefront theme (storefront/) to the Shopify store, run in CI
# because the operator has no local machine — same pattern as the fulfilment worker.
#
# The theme is pushed as an UNPUBLISHED theme named "Etch", so the live storefront
# never changes until the user previews it and taps Publish in the Shopify admin.
# Re-running updates the same theme in place.
#
# Required repository secrets:
#   SHOPIFY_CLI_THEME_TOKEN  From the free "Theme Access" app (by Shopify): Shopify
#                            admin → Apps → search "Theme Access" → install → create
#                            a password for yourself → the emailed link reveals a
#                            token starting shptka_.
#   SHOPIFY_STORE_DOMAIN     The store's .myshopify.com domain (Settings → Domains,
#                            or the admin URL), e.g. your-store.myshopify.com —
#                            NOT byetch.com.

name: Deploy storefront theme

on:
  workflow_dispatch:
  push:
    branches: [claude/rebrand-etch]
    paths:
      - "storefront/**"
      - ".github/workflows/deploy-storefront.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_CLI_TTY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli --no-fund --no-audit

      - name: Theme check
        run: shopify theme check --path storefront --fail-level error

      - name: Check Shopify credentials
        run: |
          missing=""
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then missing="$missing SHOPIFY_CLI_THEME_TOKEN"; fi
          if [ -z "$SHOPIFY_FLAG_STORE" ];      then missing="$missing SHOPIFY_STORE_DOMAIN"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them on your phone: github.com/puhrmcl/stridemap → Settings →"
            echo "Secrets and variables → Actions → New repository secret."
            echo ""
            echo "SHOPIFY_CLI_THEME_TOKEN: Shopify admin → Apps → search 'Theme Access'"
            echo "  (free, by Shopify) → install → create a password with your email →"
            echo "  open the emailed link → copy the token (starts with shptka_)."
            echo "SHOPIFY_STORE_DOMAIN: the store's .myshopify.com domain from the admin"
            echo "  URL or Settings → Domains (e.g. your-store.myshopify.com)."
            echo "Then re-run this workflow."
            exit 1
          fi

      - name: Push theme (unpublished "Etch" — publish from the admin)
        run: |
          set -o pipefail
          # Update the existing "Etch" theme if it exists; otherwise create it as a
          # new unpublished theme. Publishing stays a human decision in the admin.
          THEME_ID=$(shopify theme list --json 2>/dev/null | node -e '
            let s = "";
            process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => {
              try {
                const rows = JSON.parse(s);
                const t = rows.find(r => r.name === "Etch");
                process.stdout.write(t ? String(t.id) : "");
              } catch { process.stdout.write(""); }
            });
          ')
          if [ -n "$THEME_ID" ]; then
            echo "Updating existing Etch theme ($THEME_ID)."
            shopify theme push --path storefront --theme "$THEME_ID" | tee push.log
          else
            echo "Creating the Etch theme (unpublished)."
            shopify theme push --path storefront --unpublished --theme "Etch" | tee push.log
          fi
          echo ""
          echo "── Preview & publish (on your phone):"
          echo "Shopify admin → Online Store → Themes → 'Etch' → ⋯ → Preview."
          echo "When it looks right: ⋯ → Publish. Re-running this workflow updates"
          echo "the same theme; it never publishes on its own."
