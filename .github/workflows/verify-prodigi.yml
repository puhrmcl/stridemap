# Phase 1 SKU verification, run in CI because the operator has no local Mac —
# everything ships via Xcode Cloud / GitHub. The runner calls Prodigi's live API
# (read-only: product lookups + quotes; no orders, nothing charged) using the
# PRODIGI_API_KEY repository secret, and prints the results to the job log for
# the working session to read back and fix PrintCatalog.swift from.
#
# The key never appears in output; Actions masks secrets in logs regardless.

name: Verify Prodigi SKUs

on:
  workflow_dispatch:
  push:
    branches: [claude/rebrand-etch]
    paths:
      - ".github/workflows/verify-prodigi.yml"
      - "fulfilment/scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SKUs against the live Prodigi catalog
        env:
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          if [ -z "$PRODIGI_API_KEY" ]; then
            echo "::error::PRODIGI_API_KEY secret is not set."
            echo "Add it on your phone: github.com/puhrmcl/stridemap → Settings →"
            echo "Secrets and variables → Actions → New repository secret →"
            echo "Name: PRODIGI_API_KEY → paste the key → Add secret. Then re-run."
            exit 1
          fi
          chmod +x fulfilment/scripts/verify-skus.sh
          ./fulfilment/scripts/verify-skus.sh --live

      # The session's network can't reach prodigi.com, so the runner reads the range PDF and
      # probes what it finds. This is how the medal frame gets real SKUs rather than guesses.
      - name: Discover medal frame products
        if: always()
        env:
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          chmod +x fulfilment/scripts/medal-frames.sh
          ./fulfilment/scripts/medal-frames.sh --live

      # The Photo Wall's output product and the poster hanger finish. Reading the product page
      # is the only method that has ever resolved a Prodigi SKU for us; prefixes never have.
      - name: Discover multi photo frames and poster hangers
        if: always()
        env:
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          chmod +x fulfilment/scripts/discover-product.sh
          ./fulfilment/scripts/discover-product.sh GLOBAL-MPF \
            https://www.prodigi.com/products/wall-art/framed-prints/multi-photo-frames/
          echo ""
          ./fulfilment/scripts/discover-product.sh POSTER-HANGER \
            https://www.prodigi.com/products/prints-and-posters/poster-hangers/art-print-with-hanger/

      # Landscape hangers, probed by name. The batten width is part of the SKU, so a landscape
      # print needs its own code — the page scrape found 80-24X32-LAND, and these are the
      # candidates matching the 2:3 sizes the shop actually sells. Whatever answers 200 here
      # is real; whatever doesn't, isn't offered.
      - name: Probe landscape hanger candidates
        if: always()
        env:
          PRODIGI_API_KEY: ${{ secrets.PRODIGI_API_KEY }}
        run: |
          set -uo pipefail
          BASE="${PRODIGI_BASE:-https://api.prodigi.com}"
          for SKU in \
            POSTER-HANGER-90-24X36-LAND \
            POSTER-HANGER-90-36X24-LAND \
            POSTER-HANGER-60-16X24-LAND \
            POSTER-HANGER-60-24X16-LAND \
            POSTER-HANGER-50-12X18-LAND \
            POSTER-HANGER-45-12X18-LAND \
            POSTER-HANGER-50-18X12-LAND \
            POSTER-HANGER-80-24X32-LAND; do
            CODE=$(curl -s -o body.json -w "%{http_code}" --max-time 30 \
              -H "X-API-Key: $PRODIGI_API_KEY" "$BASE/v4.0/products/$SKU" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "── $SKU → FOUND"
              python3 -c "import json; p=json.load(open('body.json')).get('product',{}); print('   ', p.get('description','')[:100]); print('    printAreas:', json.dumps(p.get('printAreas',{}))[:300]); print('    attributes:', json.dumps(p.get('attributes',{}))[:300])" || head -c 400 body.json
            else
              echo "── $SKU → $CODE"
            fi
          done
